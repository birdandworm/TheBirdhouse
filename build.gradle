plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.runelite.net'
    }
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // src/test holds the standard RuneLite harness, which starts the real client with
    // this plugin loaded as a builtin. It needs the client on the runtime classpath, not
    // just to compile against, which is why this is not compileOnly. Without it
    // `gradlew build` fails on the test sources and stops being a usable check of the
    // build the plugin hub runs.
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.thebirdhouse'
version = '1.3.0'
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
